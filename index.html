<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار صفار — الأخبار</title>
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رادار صفار">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#0B0E14;--p:#121722;--p2:#171D2B;--ln:#263045;--tx:#E8ECF4;--mut:#8D97AB;--gold:#E9B44C;--up:#2ECC71;--dn:#FF5A5F;--vi:#8B7CFF;--red:#FF3B47}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px)}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);padding:10px 14px 8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}.brand img{width:26px;height:26px;border-radius:7px}.brand .k{margin-inline-start:auto}
.k{color:var(--mut);font-size:12.5px;font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tabs button{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:7px 4px;font-weight:700;font-size:13.5px;position:relative}
.tabs button.on{background:var(--gold);color:#14100A;border-color:var(--gold)}.tabs button .c{display:block;font-size:11.5px;font-weight:600;opacity:.75}
.tabs button .nb{position:absolute;top:-6px;inset-inline-end:-4px;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px}
main{padding:12px 12px 0;max-width:720px;margin:0 auto}
.f{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.f button{background:var(--p2);border:1px solid var(--ln);border-radius:20px;padding:4px 12px;font-size:13px}.f button.on{border-color:var(--gold);color:var(--gold)}
.card{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.card.imp{border-color:color-mix(in srgb,var(--vi) 45%,var(--ln))}.card.mine{border-inline-start:3px solid var(--gold)}
.card.fresh{box-shadow:0 0 0 1px var(--vi),0 0 18px #8B7CFF33}.card.flash{animation:fl 1.5s ease-out 2}@keyframes fl{0%{background:#8B7CFF44}100%{background:var(--p2)}}
.h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.d{border-radius:8px;padding:0 9px;font-size:12px;font-weight:800;border:1px solid}.d.up{color:var(--up);border-color:#2ECC7166}.d.dn{color:var(--dn);border-color:#FF5A5F66}.d.gold{color:var(--gold);border-color:#E9B44C66}.d.soft{border-style:dashed}
.t{display:block;font-weight:800;font-size:16px;line-height:1.55;margin:6px 0;text-decoration:none}
.tks{display:flex;gap:6px;flex-wrap:wrap}.tk{border:1px solid var(--ln);border-radius:8px;padding:0 8px;font-size:12.5px;font-weight:700;direction:ltr}.tk.mine{border-color:var(--gold);color:var(--gold)}
.up{color:var(--up)}.dn{color:var(--dn)}
.an{background:#0E131D;border-radius:10px;padding:9px 11px;margin-top:8px;font-size:14px;line-height:1.75}.an b{color:var(--vi)}.an .pf b{color:var(--gold)}
.sec{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.sec span{background:#ffffff0d;border-radius:8px;padding:0 8px;font-size:12px}
.new{background:var(--red);color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-weight:800;margin-inline-end:6px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.box{background:var(--p2);border:1px solid var(--ln);border-radius:16px;padding:18px;margin:16px 0;line-height:1.9}
.box h2{margin:0 0 6px;font-size:19px}.box ol{padding-inline-start:20px;margin:8px 0}
.btn{background:var(--gold);color:#14100A;border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:16px;width:100%;margin-top:10px}
.btn.g{background:var(--p);color:var(--tx);border:1px solid var(--ln);font-size:14px;padding:9px 12px}
input.code{width:100%;font-size:26px;letter-spacing:10px;text-align:center;background:var(--bg);border:1px solid var(--ln);border-radius:12px;color:var(--tx);padding:10px;direction:ltr;margin-top:8px}
.err{color:var(--dn);font-weight:700;margin-top:8px}.ok{color:var(--up);font-weight:700}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.tabs{grid-template-columns:repeat(4,1fr)}.tabs button{font-size:12.5px;padding:7px 2px}
.top1{background:linear-gradient(135deg,#1d1840,#171D2B);border:1px solid #8B7CFF66;border-radius:14px;padding:11px 12px;margin-bottom:10px}.top1 .t{font-size:16.5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:10px}.seg button{background:none;border:0;border-radius:9px;padding:6px 2px;font-size:13px;font-weight:700}.seg button.on{background:var(--gold);color:#14100A}
.sel{display:flex;gap:6px;margin-bottom:10px}.sel select{flex:1;min-width:0;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:6px;font:inherit;font-size:13px}
.ev .h b{font-size:15px;direction:ltr}.ev .ty{font-size:12.5px;color:var(--mut)}.ev .sum{margin:6px 0 2px;font-weight:600}.ev .why{color:var(--mut);font-size:13.5px}
.nums{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;margin-top:6px}.nums span{background:#ffffff0a;border-radius:8px;padding:1px 8px}
.lnk{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:13px}.lnk a{color:#9fb4ff}
.day{display:grid;grid-template-columns:78px 1fr;gap:8px;border-top:1px solid var(--ln);padding:8px 0}.day.soon .dd b{color:var(--gold)}.row{padding:2px 0;font-size:14px}.row.mine b{color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:start}.tbl th{color:var(--mut);font-weight:600}.tbl tr.past{opacity:.5}.tbl tr.mine td:first-child{color:var(--gold);font-weight:800}
.mood{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.mood div{flex:0 0 auto;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:5px 10px;font-size:12.5px;white-space:nowrap}
</style>
</head>
<body>
<div class="top"><div class="brand"><img src="icon-192.png" alt="">رادار صفار <span class="k" id="st"></span></div><div class="tabs" id="tabs" hidden></div></div>
<main id="app"><div class="empty">جاري التحميل…</div></main>
<script>
(() => {
const API = 'https://jttsvackcwgidkxakwsg.supabase.co/functions/v1/soffar-push';
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ls = {get: (k, v) => { try { const x = localStorage.getItem(k); return x == null ? v : JSON.parse(x); } catch (e) { return v; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushOK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const ui = {cat: 'stocks', imp: true, mine: false, prev: ls.get('rn_seen', null)};
let N = null, focus = null;
const call = async (a, x = {}) => { const r = await fetch(API, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({a, ...x})}); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || 'http_' + r.status), {j}); return j; };
const ago = t => { const m = Math.max(0, Math.round((Date.now() - new Date(t)) / 60000)); return m < 60 ? `قبل ${m} د` : m < 1440 ? `قبل ${Math.round(m / 60)} س` : `قبل ${Math.round(m / 1440)} يوم`; };
const b64u = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
let reg = null;
async function sw() { if (!reg && 'serviceWorker' in navigator) reg = await navigator.serviceWorker.register('sw.js', {scope: './'}); return reg; }
if ('serviceWorker' in navigator) {
  sw().catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.t === 'open') { focus = e.data.nid; load(); } else if (e.data && e.data.t === 'push') load(); });
}
function hashFocus() { const m = location.hash.match(/n=([^&]+)/); if (m) { focus = decodeURIComponent(m[1]); history.replaceState(null, '', location.pathname); } }

// ---------- not installed / not paired ----------
function viewInstall() {
  $('#tabs').hidden = true;
  app.innerHTML = `<div class="box"><h2>📲 ثبّت التطبيق على الشاشة الرئيسية</h2>
   عشان الإشعارات توصلك على شاشة الآيفون لازم التطبيق يكون مثبّت:
   <ol><li>افتح الصفحة دي من <b>Safari</b>.</li><li>دوس على زرار المشاركة <b>⬆️</b> تحت.</li><li>اختار <b>«إضافة إلى الشاشة الرئيسية»</b> ثم «إضافة».</li><li>افتح «رادار صفار» من الشاشة الرئيسية وكمّل من هناك.</li></ol>
   <div class="k">محتاج iOS 16.4 أو أحدث. على أندرويد افتحها من Chrome واختار «تثبيت التطبيق».</div></div>`;
}
function viewPair(msg) {
  $('#tabs').hidden = true;
  app.innerHTML = `<div class="box"><h2>🔔 فعّل إشعارات الأخبار</h2>
   افتح «رادار صفار» على Claude، روح صفحة <b>الأخبار</b> واضغط <b>«📲 إشعارات الموبايل»</b>، هيظهرلك كود من 6 أرقام صالح 30 دقيقة. اكتبه هنا:
   <input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
   <button class="btn" id="go">فعّل الإشعارات</button>${msg ? `<div class="err">${esc(msg)}</div>` : ''}
   <div class="k" style="margin-top:8px">الآيفون هيسألك «السماح بالإشعارات» — اختار «سماح».</div></div>`;
  $('#go').onclick = pair;
}
async function pair() {
  const code = ($('#code').value || '').replace(/\D/g, '');
  if (code.length !== 6) return viewPair('الكود 6 أرقام');
  $('#go').disabled = true; $('#go').textContent = 'جاري التفعيل…';
  try {
    if (await Notification.requestPermission() !== 'granted') return viewPair('الإشعارات مقفولة. افتح الإعدادات ← الإشعارات ← رادار صفار وفعّلها، وجرّب تاني.');
    const r = await sw(); await navigator.serviceWorker.ready;
    const {pub} = await call('vapid');
    let s = await r.pushManager.getSubscription(); if (s) await s.unsubscribe();
    s = await r.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u(pub)});
    const j = await call('pair', {code, sub: s.toJSON(), ua: navigator.userAgent});
    ls.set('rn_tok', j.token); ls.set('rn_ep', s.endpoint);
    await call('test', {token: j.token}).catch(() => {});
    load();
  } catch (e) { viewPair(e.message === 'bad_code' ? 'الكود غلط أو خلص — اطلب كود جديد من التطبيق.' : e.message === 'locked' ? 'محاولات كتير غلط. استنى نص ساعة وجرّب بكود جديد.' : 'حصلت مشكلة: ' + e.message); }
}

// ---------- news ----------
const CAT = [['stocks', '📈 الأسهم'], ['egypt', '🇪🇬 الاقتصاد'], ['world', '🌍 العالم'], ['disc', '📄 الإفصاحات']];
function dedupe(L) {
  const key = x => (x.tk || []).length ? x.tk.slice().sort().join(',') + '|' + String(x.at).slice(0, 10) : String(x.t).replace(/[^\p{L}\p{N} ]/gu, '').split(/\s+/).slice(0, 5).join(' ');
  const by = new Map();
  for (const x of L) { const k = key(x), g = by.get(k); if (!g) by.set(k, {...x, more: 0}); else { if (!!x.an && !g.an) by.set(k, {...x, more: g.more + 1}); else g.more++; } }
  return [...by.values()];
}
function card(x) {
  const A = x.an, d = A && A.dir != null ? +A.dir : x.dir, dc = d > 0 ? 'up' : d < 0 ? 'dn' : 'gold', dl = A && A.label ? A.label : d > 0 ? 'إيجابي' : d < 0 ? 'سلبي' : 'محايد';
  const fr = ui.prev && x.sn && String(x.sn) > String(ui.prev);
  const tk = (x.tk || []).map(t => { const p = x.rx && x.rx[t]; return `<span class="tk${x.held ? ' mine' : ''}">${esc(t)}${p != null ? ` <b class="${p > 0 ? 'up' : p < 0 ? 'dn' : ''}">${p > 0 ? '+' : ''}${(+p).toFixed(1)}%</b>` : ''}</span>`; }).join('');
  const an = A ? `<div class="an"><div><b>التحليل:</b> ${esc(A.what || '')}</div>${A.impact ? `<div><b>الأثر المتوقع:</b> ${esc(A.impact)}</div>` : ''}${A.pf && x.held ? `<div class="pf"><b>على محفظتك:</b> ${esc(A.pf)}</div>` : ''}${(A.sectors || []).length ? `<div class="sec">${A.sectors.map(s => `<span class="${s.d > 0 ? 'up' : s.d < 0 ? 'dn' : ''}">${esc(s.n)} ${s.d > 0 ? '▲' : s.d < 0 ? '▼' : '•'}</span>`).join('')}</div>` : ''}</div>`
    : x.imp ? '<div class="an k">🧠 التحليل بيتكتب في التحديث الجاي.</div>' : '';
  return `<article class="card${x.imp ? ' imp' : ''}${x.held ? ' mine' : ''}${fr ? ' fresh' : ''}" data-nid="${esc(x.id)}"><div class="h"><span class="k">${fr ? '<span class="new">🆕 جديد</span>' : ''}${esc(x.s || '')}${x.more ? ` · +${x.more} مصدر` : ''} · ${ago(x.at)}</span><span class="d ${dc}${A ? '' : ' soft'}">${esc(dl)}</span></div>
   <a class="t" href="${esc(/^https?:/.test(x.u || '') ? x.u : '#')}" target="_blank" rel="noopener">${esc(x.t)}</a>${tk ? `<div class="tks">${tk}</div>` : ''}${an}</article>`;
}
function mood() {
  const G = Object.fromEntries(((N && N.global) || []).map(q => [q.sym, q])), t = (l, s, inv) => { const q = G[s]; if (!q || q.c == null) return ''; const g = inv ? -q.c : q.c; return `<div>${l} <b class="${g > 0 ? 'up' : g < 0 ? 'dn' : ''}">${q.c > 0 ? '+' : ''}${(+q.c).toFixed(2)}%</b></div>`; };
  return `<div class="mood">${t('الدولار/الجنيه', 'EGP=X', true)}${t('برنت', 'BZ=F')}${t('الذهب', 'GC=F')}${t('S&P', '^GSPC')}${t('الأسواق الناشئة', 'EEM')}${t('السعودية', '^TASI.SR')}</div>`;
}

// ---------- disclosures from the exchange: feed · calendar · dividends · AGMs ----------
let E = null, Eat = 0;
const DIRC = {'إيجابي': 'up', 'سلبي': 'dn', 'مختلط': 'gold', 'محايد': 'gold'};
const AR_WD = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
const dayStr = (d = new Date()) => new Intl.DateTimeFormat('en-CA', {timeZone: 'Africa/Cairo'}).format(d);
const dShow = iso => { if (!iso) return '—'; const d = new Date(iso + 'T12:00:00Z'); return `${AR_WD[d.getUTCDay()]} ${d.getUTCDate()}/${d.getUTCMonth() + 1}`; };
const daysTo = iso => iso ? Math.round((Date.parse(iso + 'T12:00:00Z') - Date.parse(dayStr() + 'T12:00:00Z')) / 864e5) : null;
const inDays = n => n == null ? '' : n === 0 ? 'النهارده' : n === 1 ? 'بكرة' : n === -1 ? 'امبارح' : n > 0 ? `بعد ${n} يوم` : `من ${-n} يوم`;
const n2 = (x, d = 2) => x == null || !isFinite(x) ? '—' : Number(x).toFixed(d);
const big = v => { v = Math.abs(+v); return v >= 1e9 ? n2(v / 1e9, 2) + ' مليار' : v >= 1e6 ? n2(v / 1e6, 1) + ' مليون' : n2(v, 0); };
const EVG = {div: ['cash_dividend', 'stock_dividend', 'split', 'reverse_split', 'rights_issue', 'capital_reduction', 'capital_increase', 'tender'], res: ['results'], ga: ['ga_invite', 'ga_decisions', 'board_decisions', 'board_invite'], own: ['treasury_buy', 'treasury_sell', 'major_holder', 'governance'], ops: ['deal', 'operations', 'legal', 'delisting', 'other'], halt: ['halt'], list: ['listing']};
const EVGL = [['main', 'كل المهم'], ['div', 'توزيعات ورأس مال'], ['res', 'نتائج أعمال'], ['ga', 'جمعيات ومجالس'], ['own', 'خزينة ومساهمين'], ['ops', 'صفقات وتشغيل'], ['halt', 'إيقافات'], ['all', 'الكل']];
const inGrp = (e, g) => g === 'all' ? true : g === 'main' ? !['halt', 'listing', 'governance'].includes(e.type) : (EVG[g] || []).includes(e.type);
const evd = {sub: 'feed', scope: 'all', grp: 'main', dir: '', n: 40};
const heldE = () => new Set((E && E.held) || []);
const yieldOf = e => { const p = E && E.px && E.px[e.t]; return e.amount != null && p ? +e.amount / p * 100 : null; };
async function loadEv(force) {
  if (!force && E && Date.now() - Eat < 300000) return;
  try { E = await call('ev', {token: ls.get('rn_tok')}); Eat = Date.now(); if (ui.cat === 'disc') render(); } catch (e) {}
}
function evNums(e) {
  const o = [];
  if (e.amount != null) o.push(`الكوبون <b>${n2(+e.amount, +e.amount < 1 ? 3 : 2)}</b> ج${yieldOf(e) != null ? ` (عائد ${n2(yieldOf(e), 1)}%)` : ''}`);
  if (e.np != null) o.push(`صافي ${+e.np >= 0 ? 'الربح' : 'الخسارة'} ${big(e.np)}${e.np_chg != null ? ` <b class="${+e.np_chg >= 0 ? 'up' : 'dn'}">${+e.np_chg > 0 ? '+' : ''}${n2(+e.np_chg, 1)}%</b>` : ''}`);
  [['cum', 'آخر يوم بالحق'], ['ex', 'عدم الحق'], ['pay', 'الصرف'], ['ev', e.type === 'ga_invite' ? 'الجمعية' : e.type === 'board_invite' ? 'الاجتماع' : 'التاريخ'], ['sub_end', 'نهاية الاكتتاب']].forEach(([k, l]) => { if (e[k]) o.push(`${l} ${dShow(e[k])}`); });
  return o;
}
function evCard(e, H) {
  const d = DIRC[e.dir] || 'gold', att = e.att || [], kp = (e.x && e.x.key_points) || [];
  return `<article class="card ev${H.has(e.t) ? ' mine' : ''}"><div class="h"><span><b>${esc(e.t || '')}</b> <span class="ty">${esc(e.type_ar || '')}${H.has(e.t) ? ' · <span style="color:var(--gold)">في محفظتك</span>' : ''}</span></span><span class="d ${d}">${esc(e.dir || 'غير محسوم')}</span></div>
   <div class="sum">${esc(e.sum || e.title || '')}</div>${e.why ? `<div class="why">ليه: ${esc(e.why)}</div>` : ''}
   ${evNums(e).length ? `<div class="nums">${evNums(e).map(x => `<span>${x}</span>`).join('')}</div>` : ''}
   ${kp.length ? `<ul style="margin:6px 0;padding-inline-start:18px;font-size:13.5px">${kp.slice(0, 4).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
   <div class="lnk"><span class="k">${e.at ? dShow(dayStr(new Date(e.at))) + ' · ' + new Date(e.at).toLocaleTimeString('ar-EG-u-nu-latn', {timeZone: 'Africa/Cairo', hour: '2-digit', minute: '2-digit'}) : ''}</span>${att.map((a, i) => /^https?:/.test(a.url || '') ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">📎 المرفق${att.length > 1 ? ' ' + (i + 1) : ''}</a>` : '').join('')}${/^https?:/.test(e.url || '') ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">الإفصاح ↗</a>` : ''}</div></article>`;
}
function evDates(L) {
  const out = [], T = dayStr();
  const lab = {cum: e => e.type === 'rights_issue' ? 'آخر يوم بحق الاكتتاب' : 'آخر يوم شراء بالحق', ex: () => 'عدم الحق (السعر بيتسوّى)', pay: e => e.type === 'cash_dividend' ? 'صرف الكوبون' : 'توزيع الأسهم', ev: e => e.type === 'ga_invite' ? 'جمعية ' + ((e.x && e.x.ga_kind) || 'عامة') : e.type === 'board_invite' ? 'اجتماع مجلس' : e.type_ar, sub_end: () => 'آخر يوم اكتتاب'};
  L.forEach(e => Object.keys(lab).forEach(k => { if (e[k] && e[k] >= T) out.push({d: e[k], k, l: lab[k](e), e}); }));
  return out.sort((a, b) => a.d.localeCompare(b.d));
}
function discView() {
  loadEv();
  const segs = [['feed', 'الإفصاحات'], ['cal', 'التقويم'], ['div', 'التوزيعات'], ['ga', 'الجمعيات']];
  let h = `<div class="seg">${segs.map(([k, l]) => `<button data-evs="${k}" class="${evd.sub === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  if (!E) return h + '<div class="empty">جاري تحميل إفصاحات البورصة…</div>';
  const H = heldE(), T = dayStr();
  if (evd.sub === 'feed') {
    const sel = (k, o) => `<select data-evf="${k}">${o.map(([v, l]) => `<option value="${esc(v)}" ${evd[k] === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    let L = (E.recent || []).filter(e => inGrp(e, evd.grp) && (!evd.dir || e.dir === evd.dir) && (evd.scope === 'all' || H.has(e.t)));
    L.sort((a, b) => (evd.scope === 'all' ? (H.has(b.t) && daysTo(dayStr(new Date(b.at))) >= -2) - (H.has(a.t) && daysTo(dayStr(new Date(a.at))) >= -2) : 0) || String(b.at).localeCompare(String(a.at)));
    return h + `<div class="sel">${sel('scope', [['all', 'كل السوق'], ['held', 'أسهمي بس']])}${sel('grp', EVGL)}${sel('dir', [['', 'كل الأثر'], ['إيجابي', 'إيجابي'], ['سلبي', 'سلبي'], ['مختلط', 'مختلط'], ['محايد', 'محايد']])}</div>`
      + `<div class="k" style="margin-bottom:8px">${L.length} إفصاح آخر 30 يوم · أسهمك فوق</div>` + (L.slice(0, evd.n).map(e => evCard(e, H)).join('') || '<div class="empty">مفيش إفصاحات بالفلاتر دي.</div>')
      + (L.length > evd.n ? `<button class="btn g" data-evmore>اعرض أكتر (${L.length - evd.n})</button>` : '');
  }
  if (evd.sub === 'cal') {
    const by = {}; evDates(E.upcoming || []).filter(x => daysTo(x.d) <= 45).forEach(x => (by[x.d] = by[x.d] || []).push(x));
    const days = Object.keys(by).sort();
    return h + `<div class="card">${days.map(d => `<div class="day${daysTo(d) <= 1 ? ' soon' : ''}"><div class="dd"><b>${dShow(d)}</b><div class="k">${inDays(daysTo(d))}</div></div><div>${by[d].sort((a, b) => H.has(b.e.t) - H.has(a.e.t)).map(x => `<div class="row${H.has(x.e.t) ? ' mine' : ''}"><b>${esc(x.e.t || '')}</b> ${esc(x.l)}${x.e.amount != null && x.k === 'cum' ? ` · كوبون ${n2(+x.e.amount, 2)} ج${yieldOf(x.e) != null ? ` <span class="up">${n2(yieldOf(x.e), 1)}%</span>` : ''}` : ''}</div>`).join('')}</div></div>`).join('') || '<div class="empty">مفيش مواعيد جاية متسجلة.</div>'}
      <div class="k" style="margin-top:8px">آخر يوم بالحق = آخر جلسة تشتري فيها وتاخد التوزيع. يوم عدم الحق السعر بيتسوّى بقيمة التوزيع، وده مش هبوط حقيقي.</div></div>`;
  }
  if (evd.sub === 'div') {
    const seen = new Set(), L = [...(E.upcoming || []), ...(E.recent || [])].filter(e => ['cash_dividend', 'stock_dividend', 'rights_issue', 'split', 'reverse_split'].includes(e.type) && (e.cum || e.ex || e.pay) && !seen.has(e.k) && seen.add(e.k))
      .sort((a, b) => ((a.cum || a.ex || '') < T) - ((b.cum || b.ex || '') < T) || (a.cum || a.ex || '').localeCompare(b.cum || b.ex || ''));
    return h + `<div class="card" style="overflow-x:auto"><table class="tbl"><thead><tr><th>السهم</th><th>النوع</th><th>القيمة</th><th>العائد</th><th>آخر يوم بالحق</th><th>الصرف</th></tr></thead><tbody>
      ${L.map(e => { const y = yieldOf(e), n = daysTo(e.cum || e.ex); return `<tr class="${n != null && n < 0 ? 'past' : ''}${H.has(e.t) ? ' mine' : ''}"><td>${esc(e.t || '')}</td><td>${esc(e.type_ar || '')}</td><td>${e.amount != null ? n2(+e.amount, +e.amount < 1 ? 3 : 2) + ' ج' : esc((e.x && e.x.ratio_text) || '—')}</td><td>${y != null ? `<span class="up">${n2(y, 1)}%</span>` : '—'}</td><td>${dShow(e.cum)}<div class="k">${inDays(n)}</div></td><td>${dShow(e.pay)}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">مفيش توزيعات.</td></tr>'}</tbody></table></div>`;
  }
  const seen = new Set(), inv = [...(E.upcoming || []), ...(E.recent || [])].filter(e => ['ga_invite', 'board_invite'].includes(e.type) && !seen.has(e.k) && seen.add(e.k)).sort((a, b) => ((a.ev || '') < T) - ((b.ev || '') < T) || (a.ev || '').localeCompare(b.ev || ''));
  const dec = (E.recent || []).filter(e => ['ga_decisions', 'board_decisions'].includes(e.type)).slice(0, 30);
  return h + `<div class="card" style="overflow-x:auto"><b>مواعيد الجمعيات والمجالس (${inv.length})</b><table class="tbl"><thead><tr><th>السهم</th><th>النوع</th><th>الميعاد</th><th>باقي</th></tr></thead><tbody>
    ${inv.map(e => { const n = daysTo(e.ev); return `<tr class="${n != null && n < 0 ? 'past' : ''}${H.has(e.t) ? ' mine' : ''}"><td>${esc(e.t || '')}</td><td>${e.type === 'board_invite' ? 'مجلس إدارة' : 'جمعية ' + esc((e.x && e.x.ga_kind) || '')}</td><td>${dShow(e.ev)}${e.ev_time ? ' ' + esc(e.ev_time) : ''}</td><td>${inDays(n)}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="k" style="margin:4px 0 8px">قرارات الجمعيات والمجالس — آخر 30 يوم</div>${dec.map(e => evCard(e, H)).join('') || '<div class="empty">مفيش.</div>'}`;
}
document.addEventListener('change', e => { const s = e.target.closest('[data-evf]'); if (s) { evd[s.dataset.evf] = s.value; evd.n = 40; render(); } });
function render() {
  if (!N) return;
  const I = N.items || [], fresh = c => I.filter(x => x.cat === c && ui.prev && String(x.sn) > String(ui.prev)).length;
  $('#tabs').hidden = false;
  $('#tabs').innerHTML = CAT.map(([k, l]) => `<button data-cat="${k}" class="${ui.cat === k ? 'on' : ''}">${l}<span class="c">${k === 'disc' ? 'البورصة' : ((N.counts || {})[k] || 0) + ' مهم 24س'}</span>${fresh(k) && ui.cat !== k ? `<span class="nb">${fresh(k)}</span>` : ''}</button>`).join('');
  if (ui.cat === 'disc') { app.innerHTML = discView(); return; }
  const tp = I.filter(x => x.cat === ui.cat && x.imp && x.an && Date.now() - new Date(x.at) < 864e5).sort((a, b) => (b.held - a.held) || (b.sc - a.sc))[0];
  let L = dedupe(I.filter(x => x.cat === ui.cat && (!ui.imp || x.imp || x.held) && (!ui.mine || x.held))).sort((a, b) => String(b.at).localeCompare(String(a.at)));
  app.innerHTML = (ui.cat !== 'stocks' ? mood() : '') + (tp ? `<div class="top1"><div class="k">⭐ الأهم دلوقتي · ${ago(tp.at)}</div><a class="t" href="#" data-nid-go="${esc(tp.id)}">${esc(tp.t)}</a><div class="k">${esc(tp.an.impact || tp.an.what || '')}</div></div>` : '') + `<div class="f"><button data-imp class="${ui.imp ? 'on' : ''}">⭐ المهمة بس</button>${ui.cat === 'stocks' ? `<button data-mine class="${ui.mine ? 'on' : ''}">💼 أسهمك</button>` : ''}</div>`
    + (L.slice(0, 60).map(card).join('') || '<div class="empty">مفيش أخبار هنا دلوقتي.</div>')
    + `<div class="foot"><button class="btn g" data-test>🔔 جرّب إشعار</button><button class="btn g" data-unpair>افصل الجهاز ده</button></div><div class="k" style="text-align:center">بيتحدث لوحده · آخر تحديث ${new Date(N.at).toLocaleTimeString('ar-EG-u-nu-latn', {hour: '2-digit', minute: '2-digit'})}</div>`;
  if (focus) { const f = focus; focus = null; const it = I.find(x => x.id === f); if (it && it.cat !== ui.cat) { ui.cat = it.cat; ui.imp = false; return render(); }
    requestAnimationFrame(() => { const el = document.querySelector(`[data-nid="${CSS.escape(f)}"]`); if (el) { el.scrollIntoView({block: 'center', behavior: 'smooth'}); el.classList.add('flash'); } }); }
}
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-nid-go]'); if (g) { e.preventDefault(); focus = g.dataset.nidGo; ui.imp = false; render(); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cat) { ui.cat = b.dataset.cat; scrollTo(0, 0); render(); }
  else if (b.dataset.evs) { evd.sub = b.dataset.evs; render(); }
  else if (b.hasAttribute('data-evmore')) { evd.n += 40; render(); }
  else if (b.hasAttribute('data-imp')) { ui.imp = !ui.imp; render(); }
  else if (b.hasAttribute('data-mine')) { ui.mine = !ui.mine; render(); }
  else if (b.hasAttribute('data-test')) { b.disabled = true; b.textContent = 'اتبعت… بص على الإشعارات'; try { await call('test', {token: ls.get('rn_tok')}); } catch (x) { b.textContent = 'ماوصلش: ' + x.message; } }
  else if (b.hasAttribute('data-unpair')) { if (!confirm('تفصل الجهاز ده عن إشعارات الأخبار؟')) return; try { await call('unpair', {token: ls.get('rn_tok')}); } catch (x) {} ls.set('rn_tok', null); const s = reg && await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); viewPair(); }
});
async function load() {
  const tok = ls.get('rn_tok', null);
  if (!tok) return pushOK && standalone ? viewPair() : pushOK || standalone ? viewPair() : viewInstall();
  $('#st').textContent = '…';
  try {
    N = await call('news', {token: tok});
    $('#st').textContent = N.profile === 'sherif' ? 'رادار شريف' : '';
    render();
    const last = (N.items || []).reduce((m, x) => String(x.sn) > m ? String(x.sn) : m, '');
    if (last) ls.set('rn_seen', last);
    if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {});
    try { const r = await sw(), s = r && await r.pushManager.getSubscription();
      if (s && s.endpoint !== ls.get('rn_ep')) { await call('resub', {token: tok, sub: s.toJSON()}).catch(() => {}); ls.set('rn_ep', s.endpoint); } } catch (x) {}
  } catch (e) { if (e.message === 'unpaired') { ls.set('rn_tok', null); return viewPair('الجهاز اتفصل — فعّله تاني بكود جديد.'); } $('#st').textContent = 'مفيش اتصال'; if (!N) app.innerHTML = '<div class="empty">مفيش اتصال بالإنترنت. هيحاول تاني لوحده.</div>'; }
}
hashFocus();
if (!standalone && /iPhone|iPad/.test(navigator.userAgent) && !ls.get('rn_tok')) viewInstall(); else load();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { ui.prev = ls.get('rn_seen', ui.prev); load(); } });
setInterval(() => { if (document.visibilityState === 'visible' && ls.get('rn_tok')) { load(); if (ui.cat === 'disc') loadEv(); } }, 120000);
})();
</script>
