 td{background:none!important;padding:0!important;text-align:start;opacity:1!important}td::before{content:attr(data-l);display:block;font-size:10.5px;color:var(--mut)}td:first-child{grid-column:1/-1;font-size:15px}td:first-child::before{display:none}td:last-child{grid-column:1/-1}tr.l{border-inline-start:4px solid var(--mc)}td.x{display:none}}

   ${quiet.length && f !== 'mine' ? `<button type="button" class="btn" id="q">${S.q ? 'اخفي الهاديين' : `اعرض الهاديين (${quiet.length})`}</button>` : ''}</section>
   <section class="card"><b>🔔 اللي بيحصل</b> <span class="k">الخمس حالات بس</span><div class="feed">${feed}</div></section></div>
   <div class="k">تجربة قراءة مباشرة من السيرفر من غير Claude. القرار من آخر تحديث للتطبيق الكامل (كل 30 ث)، والأسعار كل 3 ث. تحليل بيانات، مش نصيحة استثمارية.</div>`];
}
const PV = {};
function paint() { const a = $('#app'); if (!$('#pb')) a.innerHTML = '<div id="pb"></div><div class="wrap"><div id="ptk"></div><div id="pm" style="display:grid;gap:10px"></div></div>'; const y = (document.querySelector('.tbw') || {}).scrollTop || 0, [b, t, m] = view(); [['pb', b], ['ptk', t], ['pm', m]].forEach(([id, h]) => { if (PV[id] !== h) { PV[id] = h; $('#' + id).innerHTML = h; } }); const tb = document.querySelector('.tbw'); if (tb) tb.scrollTop = y; }
async function pull() {
  if (document.visibilityState === 'hidden') return;
  const full = !S.full || Date.now() - S.fullAt > 30000, t0 = performance.now();
  const {data, error} = await sb.rpc('soffar_direct', {p_full: full});
  S.rtt = Math.round(performance.now() - t0);
  if (error) { S.err = error.message.includes('not allowed') ? 'الحساب ده مش مسموح له' : 'الاتصال فشل — بيحاول تاني'; paint(); return; }
  S.err = ''; S.live = data; if (full) { S.full = data; S.fullAt = Date.now(); } paint();
}
function login(msg) {
  Object.keys(PV).forEach(k => delete PV[k]);
  $('#app').innerHTML = `<form class="login" id="lf"><b style="font-size:18px">⚡ رادار صفار لايف</b><span class="k">ادخل بحساب رادار صفار (نفس حساب Radar V2).</span>
   <label class="k" for="em">الإيميل</label><input id="em" type="email" autocomplete="username" value="mohamed.sofar77@gmail.com" required>
   <label class="k" for="pw">الباسورد</label><input id="pw" type="password" autocomplete="current-password" required>
   <button type="submit">دخول</button>${msg ? `<span class="dn">${esc(msg)}</span>` : ''}</form>`;
  $('#lf').addEventListener('submit', async ev => { ev.preventDefault(); const {error} = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#pw').value}); if (error) login('الإيميل أو الباسورد غلط'); else start(); });
}
let timer = null;
function start() { if (timer) return; pull(); timer = setInterval(() => { pull().catch(() => {}); }, 3000); }
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-f]'); if (c) { S.f = c.dataset.f; try { localStorage.setItem('sl_f', S.f); } catch (er) {} paint(); return; }
  if (e.target.closest('#q')) { S.q = !S.q; paint(); return; }
  if (e.target.closest('#out')) { await sb.auth.signOut(); clearInterval(timer); timer = null; S.live = S.full = null; login(); }
});
sb.auth.getSession().then(({data}) => data && data.session ? start() : login());
})();
</script>
</body>
